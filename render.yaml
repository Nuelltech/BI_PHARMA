services:
  - type: web
    name: bi-pharma-prod
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: ALLOW_DEV_FALLBACK
        value: "false"
      - key: ALLOWED_ORIGIN
        value: "https://bipharma.nuelltech.com,https://bi-pharma.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PIN_PEPPER_V1
        sync: false
      - key: TOTP_ENC_KEY_V1
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "BI Pharma <info@bipharma.nuelltech.com>"
      - key: ANTHROPIC_API_KEY
        sync: false
